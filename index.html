<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WarAs (Warkop Aswan) di Salatiga — katalog menu kopi, non-kopi, makanan, dan camilan dengan harga bersahabat."
    />
    <title>WarAs — Warkop Aswan</title>
    <script>
      // Terapkan tema sebelum React mount agar tidak ada kedipan tema terang.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("waras:theme"));
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
